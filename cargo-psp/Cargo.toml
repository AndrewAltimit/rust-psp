[package]
name = "cargo-psp"
version = "1.0.0"
description = "`cargo build` wrapper for creating Sony PSP executables"
repository = "https://github.com/AndrewAltimit/rust-psp"
license = "MIT"
authors = [
    "Marko Mijalkovic <marko.mijalkovic97@gmail.com>",
    "Paul Sajna <sajattack@gmail.com>",
    "Josh Wood <sk83rjosh@gmail.com>",
    "AndrewAltimit",
]
edition = "2024"
default-run = "cargo-psp"

[[bin]]
name = "prxgen"

[[bin]]
name = "pack-pbp"

[[bin]]
name = "mksfo"

[[bin]]
name = "prxmin"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6", features = ["derive"] }
goblin = "0.10"
scroll = "0.13"
cargo_metadata = "0.23"
rustc_version = "0.4"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
toml = "1.1"
