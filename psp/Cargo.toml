[package]
name = "psp"
description = "Rust SDK for Sony PSP homebrew development -- modernized fork with kernel mode support"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
build = "build.rs"

[lib]
crate-type = ["lib", "staticlib"]

[features]
default = []
std = []
# Compile as a stub provider (static library for external projects).
stub-only = []
embedded-graphics = ["dep:embedded-graphics-core"]
# Kernel mode module support (PSP_MODULE_INFO flag 0x1000).
# Enables: module_kernel!() macro, NAND/SIRCS/Codec syscalls,
# Media Engine control, hardware register access, and exception handling.
# Requires custom firmware (ARK-4, PRO, ME CFW, etc.).
kernel = []

[dependencies]
pastey = "0.2"
bitflags = "2.13"
libm = "0.2.16"
embedded-graphics-core = { version = "0.4", optional = true }
unstringify = "0.1"
linked_list_allocator = { version = "0.10.6", default-features = false }
spin = { version = "0.12", default-features = false, features = ["mutex", "spin_mutex"] }

[dependencies.num_enum]
version = "0.7"
default-features = false

[dependencies.num_enum_derive]
version = "0.7"
default-features = false

[lints]
workspace = true
